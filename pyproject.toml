[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-tracker"
version = "0.1.0"
description = "Private-first local internship discovery and tracking"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "Jinja2>=3.1,<4",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
internship-tracker = "internship_tracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
internship_tracker = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

